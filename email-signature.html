<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Haively email signature</title></head>
<body style="margin:24px;background:#ffffff">
<!--
  1. Upload email-signature-mark.png to your website (e.g. https://haively.com/brand/email-signature-mark.png)
     and replace the img src below with that full URL.
  2. Edit name, title and phone.
  3. Open this file in a browser, select the table, copy, and paste into Gmail / Outlook signature settings.
-->
<table cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;font-family:'Hanken Grotesk',Arial,Helvetica,sans-serif;color:#1B1A17">
  <tr>
    <td style="padding:0 14px 0 0;vertical-align:middle;border-right:1px solid #D9D4C8">
      <img src="email-signature-mark.png" width="36" height="36" alt="Haively" style="display:block;border:0;width:36px;height:36px">
    </td>
    <td style="padding:0 0 0 14px;vertical-align:middle;font-size:13px;line-height:19px">
      <div style="font-weight:700;font-size:14px;color:#1B1A17">Your Name</div>
      <div style="color:#5E5A52">Job title · Haively</div>
      <div style="color:#5E5A52">+1 (000) 000-0000 · <a href="https://haively.com" style="color:#4A6FA5;text-decoration:none">haively.com</a></div>
    </td>
  </tr>
</table>
</body>
</html>
